ke="#5CA0C6" stroke-opacity="0.18"/><text x="130" y="237" class="mono caps" fill="#89CFF0" font-size="10">EXPLORE / 03</text><text x="252" y="237" class="display" fill="#FFFFFF" font-size="14" font-weight="700">Java and Spring Boot</text><text x="252" y="254" class="mono muted" font-size="11">Deepening enterprise backend patterns, testing, and service design.</text><text x="1078" y="246" text-anchor="end" class="mono dim" font-size="10">ACTIVE</text></g><g><circle cx="78" cy="295" r="7" fill="#0B1628" stroke="#89CFF0" stroke-opacity="0.75"/><circle class="pulse" cx="78" cy="295" r="3" fill="#89CFF0"/><rect x="108" y="278" width="994" height="42" rx="10" fill="#0B1628" fill-opacity="0.82" stroke="#5CA0C6" stroke-opacity="0.18"/><text x="130" y="295" class="mono caps" fill="#89CFF0" font-size="10">EXPLORE / 04</text><text x="252" y="295" class="display" fill="#FFFFFF" font-size="14" font-weight="700">Flutter and mobile architecture</text><text x="252" y="312" class="mono muted" font-size="11">Building cross-platform experiences with maintainable application structure.</text><text x="1078" y="304" text-anchor="end" class="mono dim" font-size="10">ACTIVE</text></g><g><circle cx="78" cy="353" r="7" fill="#0B1628" stroke="#89CFF0" stroke-opacity="0.75"/><circle class="pulse" cx="78" cy="353" r="3" fill="#89CFF0"/><rect x="108" y="336" width="994" height="42" rx="10" fill="#0B1628" fill-opacity="0.82" stroke="#5CA0C6" stroke-opacity="0.18"/><text x="130" y="353" class="mono caps" fill="#89CFF0" font-size="10">RESEARCH / 05</text><text x="252" y="353" class="display" fill="#FFFFFF" font-size="14" font-weight="700">Distributed systems and system design</text><text x="252" y="370" class="mono muted" font-size="11">Studying trade-offs behind scalable, observable, and resilient platforms.</text><text x="1078" y="362" text-anchor="end" class="mono dim" font-size="10">ACTIVE</text></g><text x="48" y="414" class="mono dim" font-size="10">DIRECTION CHANGES. ENGINEERING PRINCIPLES R