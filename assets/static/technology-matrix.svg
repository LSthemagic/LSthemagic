" y="317" class="mono caps" fill="#89CFF0" font-size="11" font-weight="700">EXPERIENCE LAYER</text><text x="1124" y="317" text-anchor="end" class="mono dim" font-size="10">04</text><text x="866" y="356" class="mono muted" font-size="12">React  ·  Angular  ·  Flutter</text><text x="866" y="383" class="mono muted" font-size="12">Dart  ·  Tailwind CSS</text></g><g><rect x="450" y="345" width="300" height="135" rx="15" fill="#0B1628" fill-opacity="0.84" stroke="#5CA0C6" stroke-opacity="0.24"/><rect x="450" y="345" width="5" height="135" rx="2.5" fill="url(#accentGradient)"/><text x="472" y="382" class="mono caps" fill="#89CFF0" font-size="11" font-weight="700">DELIVERY &amp; INFRA</text><text x="730" y="382" text-anchor="end" class="mono dim" font-size="10">05</text><text x="472" y="421" class="mono muted" font-size="12">Docker  ·  GitHub Actions  ·  AWS</text><text x="472" y="448" class="mono muted" font-size="12">GCP  ·  Linux  ·  Git</text></g>
    <text x="48" y="495" class="mono dim" font-size="10">TOOLS ARE SELECTED BY CONTEXT — NOT COLLECTED AS TROPHIES</text></svg>